<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RotaCliente</title>

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">

</head>

<body>

<header class="topbar">

    <div class="logo">
        📍 Rota<span>Cliente</span>
    </div>

    <nav class="menu">
        <a href="index.html">Cadastro</a>
        <a href="pesquisa.html">Pesquisar</a>
    </nav>

</header>

<main class="container">

    <!-- SLOGAN -->
    <p class="slogan">
        RotaCliente — Seus endereços de entrega sempre salvos.
    </p>

    <section class="card">

        <h1>Cadastro de Endereços</h1>

        <form id="formCadastro">

            <div class="campo">
                <label>Nome</label>
                <input type="text" id="nome" required>
            </div>

            <div class="campo">
                <label>Endereço</label>
                <input type="text" id="endereco" required>
            </div>

            <button class="btn-salvar" type="submit">
                Salvar Cliente
            </button>

        </form>

    </section>

    <section class="lista">

        <h2>Clientes cadastrados</h2>

        <div id="listaClientes">
            <p class="vazio">Nenhum endereço cadastrado.</p>
        </div>

    </section>

</main>

<script type="module" src="script.js"></script>

</body>
</html>
